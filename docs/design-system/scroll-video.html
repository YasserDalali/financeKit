<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll-scrubbed video</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .track { height: 400vh; }               /* scroll distance = video length; raise for slower playback */
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; background: var(--blue-600); }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .copy { position: absolute; left: var(--s-12); bottom: var(--s-12); color: var(--white); max-width: 520px; }
  .copy h1 { color: var(--white); }
  .after { padding: var(--s-24) 0; text-align: center; }
</style></head><body>
<div class="track" id="track">
  <div class="stage">
    <video id="v" src="scroll-cube.mp4" muted playsinline preload="auto"></video>
    <div class="copy"><p class="eyebrow" style="color:var(--white)">Scroll</p><h1>Move down. Move back.</h1></div>
  </div>
</div>
<section class="after"><h2>Next section</h2></section>

<script>
  const v = document.getElementById('v'), track = document.getElementById('track');
  let target = 0, current = 0;

  function readScroll() {
    const max = track.offsetHeight - innerHeight;
    target = Math.min(1, Math.max(0, scrollY / max));   // 0..1 progress through the track
  }
  addEventListener('scroll', readScroll, { passive: true });

  // ease toward the target each frame so scrubbing feels smooth, not steppy
  (function tick() {
    current += (target - current) * 0.12;
    if (v.duration && Math.abs(v.currentTime - current * v.duration) > 0.01) v.currentTime = current * v.duration;
    requestAnimationFrame(tick);
  })();

  v.addEventListener('loadedmetadata', readScroll);
</script>
</body></html>
