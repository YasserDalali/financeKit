<text x="60" y="180" class="t" text-anchor="start" style="">READ ORDER</text>
<text x="60" y="206" class="s" text-anchor="start" style="font-size:12.5px;font-weight:700;fill:#0014dc">1</text>
<text x="82" y="206" class="s" text-anchor="start" style="font-size:12.5px">Caffeine holds the hot answer.</text>
<text x="60" y="228" class="s" text-anchor="start" style="font-size:12.5px;font-weight:700;fill:#0014dc">2</text>
<text x="82" y="228" class="s" text-anchor="start" style="font-size:12.5px">Postgres serves inside the fresh TTL.</text>
<text x="60" y="250" class="s" text-anchor="start" style="font-size:12.5px;font-weight:700;fill:#0014dc">3</text>
<text x="82" y="250" class="s" text-anchor="start" style="font-size:12.5px">Past the TTL, the waterfall runs.</text>
<text x="60" y="272" class="s" text-anchor="start" style="font-size:12.5px;font-weight:700;fill:#0014dc">4</text>
<text x="82" y="272" class="s" text-anchor="start" style="font-size:12.5px">The first complete answer is stored.</text>
<text x="60" y="294" class="s" text-anchor="start" style="font-size:12.5px;font-weight:700;fill:#0014dc">5</text>
<text x="82" y="294" class="s" text-anchor="start" style="font-size:12.5px">All layers fail: the stored value</text>
<text x="82" y="316" class="s" text-anchor="start" style="font-size:12.5px">is served up to max stale,</text>
<text x="82" y="338" class="s" text-anchor="start" style="font-size:12.5px">with a warning.</text>
