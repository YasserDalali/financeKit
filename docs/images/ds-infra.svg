<text x="851.2113317594631" y="696.0376456421386" class="s" text-anchor="middle" style="font-size:11.5px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">HTTP, per source</text>
<text x="60" y="830" class="t" text-anchor="start" style="">WHAT RUNS WHERE</text>
<text x="60" y="856" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">Vercel serves the React front end as a static build.</text>
<text x="60" y="877" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">Render runs the backend: one Spring Boot jar from five Maven modules.</text>
<text x="60" y="898" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">Prisma Postgres holds portfolios and the market-data store.</text>
<text x="60" y="919" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">The backend uses plain JDBC and Flyway on the direct connection string.</text>
<text x="60" y="940" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">It does not use the Prisma ORM.</text>
<text x="640" y="830" class="t" text-anchor="start" style="">FREE-TIER LIMITS THAT SHAPE THE DESIGN</text>
<text x="640" y="856" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">Prisma Postgres: 200k operations a month, 2 GB storage.</text>
<text x="640" y="877" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">Render free web service: sleeps after about 15 minutes idle.</text>
<text x="640" y="898" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">So: Caffeine in front of every read, batched inserts,</text>
<text x="640" y="919" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">a seed sized to the storage cap, refresh on visit.</text>
<text x="640" y="940" class="s" text-anchor="start" style="font-size:12.5px;fill:#0a0b1f">Prices change. See each vendor’s pricing page.</text>
<rect x="1380" y="1060" width="160" height="70" class="ink"/><line x1="1380" y1="1095" x2="1540" y2="1095" class="thin"/><line x1="1460" y1="1095" x2="1460" y2="1130" class="thin"/><text x="1392" y="1082" class="t">DS-06 INFRA</text><text x="1392" y="1118" class="s">AXO 32/40</text><text x="1472" y="1118" class="s">REV A</text></g></svg>